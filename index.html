        bing:      { name: 'Bing',       home: 'https://www.bing.com',         url: 'https://www.bing.com/search?q={query}',                  logo: 'https://i.postimg.cc/yDd6VPkN/bing.jpg',            emoji: '🅱️', noTracking: false },
        brave:     { name: 'Brave',      home: 'https://search.brave.com',     url: 'https://search.brave.com/search?q={query}',              logo: 'https://i.postimg.cc/LJX4HTn2/brave-browser.jpg',   emoji: '🦁', noTracking: true  },
        ecosia:    { name: 'Ecosia',     home: 'https://www.ecosia.org',       url: 'https://www.ecosia.org/search?q={query}',                logo: 'https://i.postimg.cc/nXzVHkCx/ecosia.jpg',          emoji: '🌳', noTracking: false },
        startpage: { name: 'Startpage',  home: 'https://www.startpage.com',    url: 'https://www.startpage.com/sp/search?query={query}',      logo: 'https://i.postimg.cc/yknY45YK/startpage.jpg',       emoji: '🛡️', noTracking: false },
        qwant:     { name: 'Qwant',      home: 'https://www.qwant.com',        url: 'https://www.qwant.com/?q={query}',                       logo: 'https://i.postimg.cc/PPKrscrj/qwant.jpg',           emoji: '❓', noTracking: false },
        yandex:    { name: 'Yandex',     home: 'https://yandex.com',           url: 'https://yandex.com/search/?text={query}',                logo: 'https://i.postimg.cc/56pNdGN1/yandex-badge.jpg',    emoji: '🇾', noTracking: false },
        yahoo:     { name: 'Yahoo',      home: 'https://search.yahoo.com',     url: 'https://search.yahoo.com/search?p={query}',              logo: 'https://i.postimg.cc/CzJLTtLS/yahoo-badge.jpg',     emoji: '🟣', noTracking: false },
        mojeek:    { name: 'Mojeek',     home: 'https://www.mojeek.com',       url: 'https://www.mojeek.com/search?q={query}',                logo: 'https://i.postimg.cc/3kRrKBdM/mojeek.jpg',          emoji: '🐱', noTracking: false },
        presearch: { name: 'Presearch',  home: 'https://presearch.com',        url: 'https://presearch.com/search?q={query}',                 logo: '',                                                  emoji: '🔎', noTracking: false }
      };

      let currentEngine = 'ddg';

      // ---------- Dropdown ----------
      function openDropdown() {
        settingsDropdown.classList.add('open');
        settingsBtn.classList.add('active');
        settingsBtn.setAttribute('aria-expanded', 'true');
      }
      function closeDropdown() {
        settingsDropdown.classList.remove('open');
        settingsBtn.classList.remove('active');
        settingsBtn.setAttribute('aria-expanded', 'false');
      }
      function toggleDropdown() {
        settingsDropdown.classList.contains('open') ? closeDropdown() : openDropdown();
      }

      settingsBtn.addEventListener('click', e => { e.stopPropagation(); toggleDropdown(); });
      document.addEventListener('click', e => {
        if (!settingsDropdown.contains(e.target) && !settingsBtn.contains(e.target)) closeDropdown();
      });
      document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDropdown(); });

      // ---------- Engine selection ----------
      engineOptions.forEach(option => {
        option.addEventListener('click', function() {
          const key = this.getAttribute('data-engine');
          if (!engines[key]) return;
          currentEngine = key;
          saveEnginePreference(key);
          updateActiveEngine();
          updateEngineUI();
          closeDropdown();
        });
      });

      function updateActiveEngine() {
        engineOptions.forEach(opt => {
          opt.classList.toggle('active', opt.getAttribute('data-engine') === currentEngine);
        });
      }

      function updateEngineUI() {
        const engine = engines[currentEngine];
        searchInput.placeholder = `Search ${engine.name} ...`;
        searchInput.setAttribute('aria-label', `Search ${engine.name}`);

        const trackingText = engine.noTracking ? ' · No tracking' : '';
        footerNote.innerHTML = `🔎 Powered by <a href="${engine.home}" target="_blank" rel="noopener noreferrer">${engine.name}</a>${trackingText} · ${engine.emoji}`;

        openEngineLink.href = engine.home;
        openEngineLink.title = `Open ${engine.name} homepage`;
      }

      // ---------- Search ----------
      function goToSearch(query) {
        const trimmed = query.trim();
        const engine = engines[currentEngine] || engines.ddg;

        if (trimmed === '') { window.open(engine.home, '_blank', 'noopener,noreferrer'); return; }

        const encodedQuery = encodeURIComponent(trimmed);
        window.open(engine.url.replace('{query}', encodedQuery), '_blank', 'noopener,noreferrer');
      }
      function performSearch() { goToSearch(searchInput.value); }

      // ---------- Storage ----------
      function saveEnginePreference(value) {
        try { localStorage.setItem('preferredEngine', value); } catch (e) {}
      }
      function loadEnginePreference() {
        try {
          const saved = localStorage.getItem('preferredEngine');
          if (saved && engines[saved]) currentEngine = saved;
        } catch (e) {}
      }

      // ---------- Event Listeners ----------
      searchIcon.addEventListener('click', e => { e.preventDefault(); performSearch(); });
      searchIcon.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); performSearch(); }
      });

      searchInput.addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); performSearch(); }
      });

      quickLinks.forEach(link => {
        link.addEventListener('click', function(e) {
          e.preventDefault();
          const query = this.getAttribute('data-query');
          if (query) { searchInput.value = query; goToSearch(query); }
        });
      });

      // ---------- Init ----------
      loadEnginePreference();
      updateActiveEngine();
      updateEngineUI();
    })();
  </script>

</body>
</html>
